<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Body, BMI & Diet Nutrition Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1e293b, #090d16 85%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app-card {
      width: 100%;
      max-width: 480px;
      background: rgba(22, 30, 46, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .header {
      text-align: center;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* 3D Viewport */
    .viewport-container {
      width: 100%;
      height: 250px;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
    }
    #threeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #threeCanvas:active {
      cursor: grabbing;
    }
    .rotate-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: #64748b;
      background: rgba(15, 23, 42, 0.75);
      padding: 2px 10px;
      border-radius: 10px;
      pointer-events: none;
    }

    /* Inputs */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 9px 30px 9px 10px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      outline: none;
    }
    .input-wrap input:focus {
      border-color: #38bdf8;
    }
    .input-unit {
      position: absolute;
      right: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      color: #64748b;
    }

    /* Goal Selection */
    .goal-select-box {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .goal-select-box label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    select {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 9px 12px;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 700;
      outline: none;
    }

    .calc-btn {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px -4px rgba(37, 99, 235, 0.5);
      transition: transform 0.1s;
    }
    .calc-btn:active {
      transform: scale(0.98);
    }

    /* Results */
    .diet-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .metric-card {
      background: rgba(15, 23, 42, 0.85);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    .metric-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .metric-val {
      font-size: 1.5rem;
      font-weight: 900;
      margin: 2px 0;
    }
    .metric-desc {
      font-size: 0.7rem;
      color: #64748b;
    }

    .bmi-card {
      margin-top: 10px;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 14px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .credits {
      text-align: center;
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>3D Body & Diet Planner</h1>
      <p>Body Simulation, BMI, Calories & Protein Target</p>
    </div>

    <!-- 3D Interactive Human Viewport -->
    <div class="viewport-container">
      <div id="threeCanvas"></div>
      <div class="rotate-hint">🔄 Ungli se ghumayein (Rotate 3D)</div>
    </div>

    <!-- User Inputs -->
    <div class="input-grid">
      <div class="input-group">
        <label>Height</label>
        <div class="input-wrap">
          <input type="number" id="heightInput" value="172" inputmode="decimal">
          <span class="input-unit">CM</span>
        </div>
      </div>

      <div class="input-group">
        <label>Weight</label>
        <div class="input-wrap">
          <input type="number" id="weightInput" value="68" inputmode="decimal">
          <span class="input-unit">KG</span>
        </div>
      </div>

      <div class="input-group">
        <label>Age</label>
        <div class="input-wrap">
          <input type="number" id="ageInput" value="20" inputmode="numeric">
          <span class="input-unit">YRS</span>
        </div>
      </div>
    </div>

    <div class="goal-select-box">
      <label>Fitness Target / Goal</label>
      <select id="goalInput" onchange="calculateAll()">
        <option value="maintain">Maintain Current Weight</option>
        <option value="lose">Fat Loss / Weight Loss (Cutting)</option>
        <option value="gain">Muscle Building / Weight Gain (Bulking)</option>
      </select>
    </div>

    <button type="button" class="calc-btn" onclick="calculateAll()">Calculate Diet & Transform 3D Avatar</button>

    <!-- Calorie & Protein Cards -->
    <div class="diet-cards-grid">
      <div class="metric-card" style="border-top: 2px solid #f59e0b;">
        <div class="metric-title">🔥 Daily Calories</div>
        <div id="calScore" class="metric-val" style="color: #f59e0b;">2150</div>
        <div class="metric-desc">kcal har din lena hai</div>
      </div>

      <div class="metric-card" style="border-top: 2px solid #10b981;">
        <div class="metric-title">🥩 Daily Protein</div>
        <div id="proScore" class="metric-val" style="color: #10b981;">110g</div>
        <div class="metric-desc">gram protein daily target</div>
      </div>
    </div>

    <!-- BMI Status Strip -->
    <div class="bmi-card">
      <div>
        <div style="font-size: 0.7rem; color: #94a3b8; font-weight: 700;">BMI INDEX</div>
        <div id="bmiScoreText" style="font-size: 1.2rem; font-weight: 900; color: #38bdf8;">23.0</div>
      </div>
      <div id="bmiStatusText" style="font-size: 0.85rem; font-weight: 800; color: #10b981; text-transform: uppercase;">
        Normal Weight
      </div>
    </div>

    <div class="credits">
      Designed & Developed by Parveen Yadav
    </div>
  </div>

  <script>
    // 3D Scene Initialization
    let scene, camera, renderer, mannequinGroup;
    let head, torso, waist, leftArm, rightArm, leftLeg, rightLeg;
    let mannequinMaterial;
    let isDragging = false;
    let prevMouseX = 0;

    function init3D() {
      const container = document.getElementById('threeCanvas');
      const w = container.clientWidth || 400;
      const h = container.clientHeight || 250;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
      camera.position.set(0, 0.5, 4.8);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const ambLight = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambLight);

      const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
      dirLight.position.set(3, 4, 3);
      scene.add(dirLight);

      const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
      backLight.position.set(-3, -2, -3);
      scene.add(backLight);

      mannequinGroup = new THREE.Group();
      mannequinMaterial = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        metalness: 0.35,
        roughness: 0.4
      });

      // Body parts
      head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 24), mannequinMaterial);
      head.position.y = 1.35;
      mannequinGroup.add(head);

      torso = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.25, 0.6, 20), mannequinMaterial);
      torso.position.y = 0.85;
      mannequinGroup.add(torso);

      waist = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.28, 0.35, 20), mannequinMaterial);
      waist.position.y = 0.42;
      mannequinGroup.add(waist);

      leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.95, 16), mannequinMaterial);
      leftArm.position.set(-0.48, 0.65, 0);
      leftArm.rotation.z = 0.12;
      mannequinGroup.add(leftArm);

      rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.95, 16), mannequinMaterial);
      rightArm.position.set(0.48, 0.65, 0);
      rightArm.rotation.z = -0.12;
      mannequinGroup.add(rightArm);

      leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 1.15, 16), mannequinMaterial);
      leftLeg.position.set(-0.18, -0.35, 0);
      mannequinGroup.add(leftLeg);

      rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 1.15, 16), mannequinMaterial);
      rightLeg.position.set(0.18, -0.35, 0);
      mannequinGroup.add(rightLeg);

      scene.add(mannequinGroup);

      // Touch & Mouse rotation controls
      const dom = renderer.domElement;
      dom.addEventListener('mousedown', (e) => { isDragging = true; prevMouseX = e.clientX; });
      window.addEventListener('mouseup', () => isDragging = false);
      dom.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const delta = e.clientX - prevMouseX;
        mannequinGroup.rotation.y += delta * 0.015;
        prevMouseX = e.clientX;
      });

      dom.addEventListener('touchstart', (e) => { isDragging = true; prevMouseX = e.touches[0].clientX; });
      window.addEventListener('touchend', () => isDragging = false);
      dom.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const delta = e.touches[0].clientX - prevMouseX;
        mannequinGroup.rotation.y += delta * 0.015;
        prevMouseX = e.touches[0].clientX;
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!isDragging) {
        mannequinGroup.rotation.y += 0.005;
      }
      renderer.render(scene, camera);
    }

    function calculateAll() {
      const hCm = parseFloat(document.getElementById('heightInput').value);
      const wKg = parseFloat(document.getElementById('weightInput').value);
      const age = parseFloat(document.getElementById('ageInput').value) || 22;
      const goal = document.getElementById('goalInput').value;

      if (!hCm || !wKg || hCm <= 0 || wKg <= 0) {
        alert("Sahi Height aur Weight daalein!");
        return;
      }

      // 1. BMI Calculation
      const hMeter = hCm / 100;
      const bmi = parseFloat((wKg / (hMeter * hMeter)).toFixed(1));
      document.getElementById('bmiScoreText').innerText = bmi;

      const statusEl = document.getElementById('bmiStatusText');
      let themeColor = 0x10b981;
      let widthFactor = 1.0;

      if (bmi < 18.5) {
        statusEl.innerText = "Underweight";
        statusEl.style.color = "#38bdf8";
        themeColor = 0x38bdf8;
        widthFactor = 0.75;
      } else if (bmi >= 18.5 && bmi <= 24.9) {
        statusEl.innerText = "Normal Weight";
        statusEl.style.color = "#10b981";
        themeColor = 0x10b981;
        widthFactor = 1.0;
      } else if (bmi >= 25 && bmi <= 29.9) {
        statusEl.innerText = "Overweight";
        statusEl.style.color = "#f59e0b";
        themeColor = 0xf59e0b;
        widthFactor = 1.35;
      } else {
        statusEl.innerText = "Obese";
        statusEl.style.color = "#ef4444";
        themeColor = 0xef4444;
        widthFactor = 1.65;
      }

      // 2. Calorie Requirement (Mifflin-St Jeor Formula)
      // BMR = 10*weight + 6.25*height - 5*age + 5 (for male)
      let bmr = (10 * wKg) + (6.25 * hCm) - (5 * age) + 5;
      let maintenanceCalories = Math.round(bmr * 1.35); // Moderate activity baseline

      let targetCalories = maintenanceCalories;
      if (goal === 'lose') {
        targetCalories = maintenanceCalories - 450; // Calorie deficit
      } else if (goal === 'gain') {
        targetCalories = maintenanceCalories + 400; // Calorie surplus
      }
      document.getElementById('calScore').innerText = targetCalories;

      // 3. Protein Requirement (Grams per Day)
      // Normal: 1.4g/kg, Loss: 1.8g/kg, Gain: 2.0g/kg
      let proteinPerKg = 1.5;
      if (goal === 'lose') proteinPerKg = 1.8;
      if (goal === 'gain') proteinPerKg = 2.0;

      const targetProtein = Math.round(wKg * proteinPerKg);
      document.getElementById('proScore').innerText = targetProtein + "g";

      // 4. Transform 3D Avatar
      const heightScale = Math.max(0.75, Math.min(1.3, hCm / 170));
      mannequinMaterial.color.setHex(themeColor);
      mannequinGroup.scale.y = heightScale;

      torso.scale.set(widthFactor, 1, widthFactor);
      waist.scale.set(widthFactor * 1.08, 1, widthFactor * 1.08);
      leftArm.scale.set(Math.max(0.85, widthFactor * 0.9), 1, Math.max(0.85, widthFactor * 0.9));
      rightArm.scale.set(Math.max(0.85, widthFactor * 0.9), 1, Math.max(0.85, widthFactor * 0.9));
      leftLeg.scale.set(Math.max(0.9, widthFactor * 0.95), 1, Math.max(0.9, widthFactor * 0.95));
      rightLeg.scale.set(Math.max(0.9, widthFactor * 0.95), 1, Math.max(0.9, widthFactor * 0.95));

      leftArm.position.x = -0.38 * widthFactor - 0.1;
      rightArm.position.x = 0.38 * widthFactor + 0.1;
    }

    window.onload = () => {
      init3D();
      calculateAll();
    };

    window.onresize = () => {
      const container = document.getElementById('threeCanvas');
      if (!renderer || !container) return;
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
  </script>
</body>
  </html>
