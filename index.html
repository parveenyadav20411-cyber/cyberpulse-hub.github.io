<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Body & Diet Planner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #0f172a, #030712 90%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app-card {
      width: 100%;
      max-width: 480px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .viewport-container {
      width: 100%;
      height: 270px;
      background: radial-gradient(circle at center, #1e293b 0%, #030712 100%);
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
    }
    #threeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #threeCanvas:active {
      cursor: grabbing;
    }
    .rotate-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.8);
      padding: 3px 12px;
      border-radius: 12px;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 9px 30px 9px 10px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      outline: none;
    }
    .input-wrap input:focus {
      border-color: #38bdf8;
    }
    .input-unit {
      position: absolute;
      right: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      color: #64748b;
    }

    .goal-select-box {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .goal-select-box label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    select {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 9px 12px;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 700;
      outline: none;
    }

    .calc-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
      transition: transform 0.1s;
    }
    .calc-btn:active {
      transform: scale(0.98);
    }

    .diet-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .metric-card {
      background: rgba(15, 23, 42, 0.85);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    .metric-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .metric-val {
      font-size: 1.5rem;
      font-weight: 900;
      margin: 2px 0;
    }
    .metric-desc {
      font-size: 0.7rem;
      color: #64748b;
    }

    .bmi-card {
      margin-top: 10px;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 14px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .credits {
      text-align: center;
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>3D Body & Diet Planner</h1>
      <p>Body Simulation, BMI, Calories & Protein Target</p>
    </div>

    <div class="viewport-container">
      <div id="threeCanvas"></div>
      <div class="rotate-hint">🔄 Drag to Rotate 3D Physique</div>
    </div>

    <div class="input-grid">
      <div class="input-group">
        <label>Height</label>
        <div class="input-wrap">
          <input type="number" id="heightInput" value="178" inputmode="decimal">
          <span class="input-unit">CM</span>
        </div>
      </div>

      <div class="input-group">
        <label>Weight</label>
        <div class="input-wrap">
          <input type="number" id="weightInput" value="55" inputmode="decimal">
          <span class="input-unit">KG</span>
        </div>
      </div>

      <div class="input-group">
        <label>Age</label>
        <div class="input-wrap">
          <input type="number" id="ageInput" value="17" inputmode="numeric">
          <span class="input-unit">YRS</span>
        </div>
      </div>
    </div>

    <div class="goal-select-box">
      <label>Fitness Target / Goal</label>
      <select id="goalInput" onchange="calculateAll()">
        <option value="gain" selected>Muscle Building / Weight Gain (Bulking)</option>
        <option value="maintain">Maintain Current Weight</option>
        <option value="lose">Fat Loss / Weight Loss (Cutting)</option>
      </select>
    </div>

    <button type="button" class="calc-btn" onclick="calculateAll()">Calculate Diet & Transform 3D Avatar</button>

    <div class="diet-cards-grid">
      <div class="metric-card" style="border-top: 2px solid #f59e0b;">
        <div class="metric-title">🔥 Daily Calories</div>
        <div id="calScore" class="metric-val" style="color: #f59e0b;">2536</div>
        <div class="metric-desc">kcal har din lena hai</div>
      </div>

      <div class="metric-card" style="border-top: 2px solid #10b981;">
        <div class="metric-title">🥩 Daily Protein</div>
        <div id="proScore" class="metric-val" style="color: #10b981;">110g</div>
        <div class="metric-desc">gram protein daily target</div>
      </div>
    </div>

    <div class="bmi-card">
      <div>
        <div style="font-size: 0.7rem; color: #94a3b8; font-weight: 700;">BMI INDEX</div>
        <div id="bmiScoreText" style="font-size: 1.2rem; font-weight: 900; color: #38bdf8;">17.4</div>
      </div>
      <div id="bmiStatusText" style="font-size: 0.85rem; font-weight: 800; color: #38bdf8; text-transform: uppercase;">
        Underweight
      </div>
    </div>

    <div class="credits">
      Designed & Developed by Parveen Yadav
    </div>
  </div>

  <script>
    let scene, camera, renderer, humanBody;
    let chest, abdomen, pelvis, neck, head;
    let lShoulder, rShoulder, lArm, rArm, lForearm, rForearm;
    let lThigh, rThigh, lCalf, rCalf;
    let bodyMat;
    let isDragging = false, prevMouseX = 0;

    function init3D() {
      const container = document.getElementById('threeCanvas');
      const w = container.clientWidth || 400;
      const h = container.clientHeight || 270;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
      camera.position.set(0, 0.1, 4.4);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Cyber Studio Lights
      const ambLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambLight);

      const keyLight = new THREE.DirectionalLight(0x38bdf8, 1.4);
      keyLight.position.set(2, 4, 3);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0x0284c7, 0.9);
      rimLight.position.set(-3, 2, -2);
      scene.add(rimLight);

      // Holographic floor grid
      const grid = new THREE.GridHelper(3, 12, 0x38bdf8, 0x1e293b);
      grid.position.y = -1.25;
      scene.add(grid);

      // Human Mannequin Group
      humanBody = new THREE.Group();

      bodyMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        metalness: 0.25,
        roughness: 0.35,
        flatShading: false
      });

      // Head & Neck
      head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 32), bodyMat);
      head.scale.set(0.9, 1.15, 0.95);
      head.position.y = 1.15;
      humanBody.add(head);

      neck = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.16, 24), bodyMat);
      neck.position.y = 0.98;
      humanBody.add(neck);

      // Athletic Chest / Upper Torso
      chest = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.42, 24), bodyMat);
      chest.position.y = 0.72;
      chest.scale.set(1.2, 1, 0.85);
      humanBody.add(chest);

      // Shoulders
      lShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.1, 20, 20), bodyMat);
      lShoulder.position.set(-0.35, 0.85, 0);
      humanBody.add(lShoulder);

      rShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.1, 20, 20), bodyMat);
      rShoulder.position.set(0.35, 0.85, 0);
      humanBody.add(rShoulder);

      // Abdomen / Waist
      abdomen = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.23, 0.3, 24), bodyMat);
      abdomen.position.y = 0.4;
      abdomen.scale.set(1.05, 1, 0.8);
      humanBody.add(abdomen);

      // Pelvis / Hips
      pelvis = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.2, 0.22, 24), bodyMat);
      pelvis.position.y = 0.18;
      pelvis.scale.set(1.08, 1, 0.85);
      humanBody.add(pelvis);

      // Arms (Upper & Forearm)
      lArm = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.065, 0.38, 20), bodyMat);
      lArm.position.set(-0.42, 0.65, 0);
      lArm.rotation.z = 0.15;
      humanBody.add(lArm);

      lForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.05, 0.38, 20), bodyMat);
      lForearm.position.set(-0.48, 0.3, 0);
      lForearm.rotation.z = 0.1;
      humanBody.add(lForearm);

      rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.065, 0.38, 20), bodyMat);
      rArm.position.set(0.42, 0.65, 0);
      rArm.rotation.z = -0.15;
      humanBody.add(rArm);

      rForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.05, 0.38, 20), bodyMat);
      rForearm.position.set(0.48, 0.3, 0);
      rForearm.rotation.z = -0.1;
      humanBody.add(rForearm);

      // Legs (Thighs & Calves)
      lThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 0.55, 24), bodyMat);
      lThigh.position.set(-0.16, -0.18, 0);
      humanBody.add(lThigh);

      lCalf = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.065, 0.58, 24), bodyMat);
      lCalf.position.set(-0.16, -0.72, 0);
      humanBody.add(lCalf);

      rThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 0.55, 24), bodyMat);
      rThigh.position.set(0.16, -0.18, 0);
      humanBody.add(rThigh);

      rCalf = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.065, 0.58, 24), bodyMat);
      rCalf.position.set(0.16, -0.72, 0);
      humanBody.add(rCalf);

      scene.add(humanBody);

      // Interaction listeners
      const dom = renderer.domElement;
      dom.addEventListener('mousedown', (e) => { isDragging = true; prevMouseX = e.clientX; });
      window.addEventListener('mouseup', () => isDragging = false);
      dom.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        humanBody.rotation.y += (e.clientX - prevMouseX) * 0.015;
        prevMouseX = e.clientX;
      });

      dom.addEventListener('touchstart', (e) => { isDragging = true; prevMouseX = e.touches[0].clientX; });
      window.addEventListener('touchend', () => isDragging = false);
      dom.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        humanBody.rotation.y += (e.touches[0].clientX - prevMouseX) * 0.015;
        prevMouseX = e.touches[0].clientX;
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!isDragging) {
        humanBody.rotation.y += 0.005;
      }
      renderer.render(scene, camera);
    }

    function calculateAll() {
      const hCm = parseFloat(document.getElementById('heightInput').value);
      const wKg = parseFloat(document.getElementById('weightInput').value);
      const age = parseFloat(document.getElementById('ageInput').value) || 18;
      const goal = document.getElementById('goalInput').value;

      if (!hCm || !wKg || hCm <= 0 || wKg <= 0) return;

      const hMeter = hCm / 100;
      const bmi = parseFloat((wKg / (hMeter * hMeter)).toFixed(1));
      document.getElementById('bmiScoreText').innerText = bmi;

      const statusEl = document.getElementById('bmiStatusText');
      let themeColor = 0x38bdf8;
      let bulkFactor = 0.8;

      if (bmi < 18.5) {
        statusEl.innerText = "Underweight";
        statusEl.style.color = "#38bdf8";
        themeColor = 0x38bdf8;
        bulkFactor = 0.78; // Lean / Slim aesthetic
      } else if (bmi >= 18.5 && bmi <= 24.9) {
        statusEl.innerText = "Normal Weight";
        statusEl.style.color = "#10b981";
        themeColor = 0x10b981;
        bulkFactor = 1.0; // Fit athletic build
      } else if (bmi >= 25 && bmi <= 29.9) {
        statusEl.innerText = "Overweight";
        statusEl.style.color = "#f59e0b";
        themeColor = 0xf59e0b;
        bulkFactor = 1.35; // Heavy build
      } else {
        statusEl.innerText = "Obese";
        statusEl.style.color = "#ef4444";
        themeColor = 0xef4444;
        bulkFactor = 1.65; // Bulkier build
      }

      // Calories (Mifflin-St Jeor formula)
      let bmr = (10 * wKg) + (6.25 * hCm) - (5 * age) + 5;
      let maintenance = Math.round(bmr * 1.35);
      let targetCal = maintenance;
      if (goal === 'gain') targetCal += 450;
      if (goal === 'lose') targetCal -= 450;
      document.getElementById('calScore').innerText = targetCal;

      // Protein
      let proMultiplier = 1.6;
      if (goal === 'gain') proMultiplier = 2.0;
      if (goal === 'lose') proMultiplier = 1.8;
      document.getElementById('proScore').innerText = Math.round(wKg * proMultiplier) + "g";

      // 3D Morphing adjustments
      bodyMat.color.setHex(themeColor);

      // Height morphing
      const heightScale = Math.max(0.75, Math.min(1.25, hCm / 175));
      humanBody.scale.y = heightScale;

      // Anatomical proportion scaling based on BMI
      chest.scale.set(bulkFactor * 1.15, 1, bulkFactor * 0.85);
      abdomen.scale.set(bulkFactor * 1.05, 1, bulkFactor * 0.9);
      pelvis.scale.set(bulkFactor * 1.05, 1, bulkFactor * 0.9);

      lThigh.scale.set(bulkFactor, 1, bulkFactor);
      rThigh.scale.set(bulkFactor, 1, bulkFactor);
      lCalf.scale.set(Math.max(0.85, bulkFactor * 0.95), 1, Math.max(0.85, bulkFactor * 0.95));
      rCalf.scale.set(Math.max(0.85, bulkFactor * 0.95), 1, Math.max(0.85, bulkFactor * 0.95));

      lArm.scale.set(bulkFactor * 0.95, 1, bulkFactor * 0.95);
      rArm.scale.set(bulkFactor * 0.95, 1, bulkFactor * 0.95);
      lForearm.scale.set(bulkFactor * 0.9, 1, bulkFactor * 0.9);
      rForearm.scale.set(bulkFactor * 0.9, 1, bulkFactor * 0.9);

      // Shoulder spacing dynamically widens with bulk
      lShoulder.position.x = -0.28 * bulkFactor - 0.08;
      rShoulder.position.x = 0.28 * bulkFactor + 0.08;
      lArm.position.x = lShoulder.position.x - 0.07;
      rArm.position.x = rShoulder.position.x + 0.07;
      lForearm.position.x = lArm.position.x - 0.06;
      rForearm.position.x = rArm.position.x + 0.06;
    }

    window.onload = () => {
      init3D();
      calculateAll();
    };

    window.onresize = () => {
      const container = document.getElementById('threeCanvas');
      if (!renderer || !container) return;
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
  </script>
</body>
          </html>
